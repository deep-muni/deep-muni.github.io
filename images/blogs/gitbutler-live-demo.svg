<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="100%" style="background:#09090f;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;">
  <defs>
    <radialGradient id="demoGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#09090f" stop-opacity="1" />
    </radialGradient>

    <pattern id="demoGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1" />
    </pattern>

    <style>
      @keyframes floatCard1 {
        0%, 15% { transform: translate(30px, 160px); opacity: 1; }
        35%, 100% { transform: translate(390px, 160px); opacity: 1; }
      }
      @keyframes floatCard2 {
        0%, 35% { transform: translate(30px, 240px); opacity: 1; }
        55%, 100% { transform: translate(390px, 280px); opacity: 1; }
      }
      @keyframes floatCard3 {
        0%, 55% { transform: translate(30px, 320px); opacity: 1; }
        75%, 100% { transform: translate(390px, 400px); opacity: 1; }
      }
      @keyframes pulseLane1 {
        0%, 30% { stroke: rgba(255, 255, 255, 0.08); }
        35%, 50% { stroke: #38bdf8; }
        55%, 100% { stroke: rgba(56, 189, 248, 0.3); }
      }
      @keyframes pulseLane2 {
        0%, 50% { stroke: rgba(255, 255, 255, 0.08); }
        55%, 70% { stroke: #a855f7; }
        75%, 100% { stroke: rgba(168, 85, 247, 0.3); }
      }
      @keyframes pulseLane3 {
        0%, 70% { stroke: rgba(255, 255, 255, 0.08); }
        75%, 90% { stroke: #10b981; }
        95%, 100% { stroke: rgba(16, 185, 129, 0.3); }
      }
      @keyframes pushPill {
        0%, 78% { opacity: 0; transform: scale(0.9); }
        85%, 95% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; }
      }
      .anim-card1 { animation: floatCard1 8s infinite ease-in-out; }
      .anim-card2 { animation: floatCard2 8s infinite ease-in-out; }
      .anim-card3 { animation: floatCard3 8s infinite ease-in-out; }
      .lane-1 { animation: pulseLane1 8s infinite ease-in-out; }
      .lane-2 { animation: pulseLane2 8s infinite ease-in-out; }
      .lane-3 { animation: pulseLane3 8s infinite ease-in-out; }
      .push-badge { animation: pushPill 8s infinite ease-in-out; }
    </style>
  </defs>

  <rect width="1100" height="580" fill="#09090f" />
  <rect width="1100" height="580" fill="url(#demoGlow)" />
  <rect width="1100" height="580" fill="url(#demoGrid)" />

  <!-- Top App Window Bar -->
  <g transform="translate(40, 30)">
    <rect width="1020" height="520" rx="14" fill="#0f0f18" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
    <rect width="1020" height="42" rx="14" fill="#151522" />
    
    <!-- Window Controls -->
    <circle cx="24" cy="21" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="40" cy="21" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="56" cy="21" r="5" fill="#10b981" opacity="0.8" />
    
    <text x="80" y="26" fill="rgba(255, 255, 255, 0.7)" font-size="12" font-weight="700">GitButler Workspace | Virtual Branch Manager</text>
    <rect x="860" y="10" width="135" height="22" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.3)" />
    <text x="872" y="25" fill="#38bdf8" font-size="10" font-weight="700">LIVE SYNC ACTIVE</text>
  </g>

  <!-- Left Column: Unassigned Changes Pool -->
  <g transform="translate(65, 85)">
    <rect width="320" height="445" rx="10" fill="#0a0a12" stroke="rgba(255, 255, 255, 0.06)" />
    
    <rect width="320" height="40" rx="10" fill="rgba(255, 255, 255, 0.02)" />
    <text x="16" y="25" fill="#ffffff" font-size="12" font-weight="700">UNASSIGNED WORKING DIFFS</text>
    <text x="240" y="25" fill="rgba(255, 255, 255, 0.4)" font-size="11">3 files</text>

    <text x="16" y="60" fill="rgba(255, 255, 255, 0.4)" font-size="11">Drag diffs into active virtual lanes:</text>

    <!-- Base slots placeholders -->
    <rect x="15" y="75" width="290" height="65" rx="8" fill="rgba(255, 255, 255, 0.01)" stroke="rgba(255, 255, 255, 0.04)" stroke-dasharray="4,4" />
    <rect x="15" y="155" width="290" height="65" rx="8" fill="rgba(255, 255, 255, 0.01)" stroke="rgba(255, 255, 255, 0.04)" stroke-dasharray="4,4" />
    <rect x="15" y="235" width="290" height="65" rx="8" fill="rgba(255, 255, 255, 0.01)" stroke="rgba(255, 255, 255, 0.04)" stroke-dasharray="4,4" />

    <text x="16" y="420" fill="rgba(255, 255, 255, 0.35)" font-size="11">Zero `git stash` or branch checkouts needed</text>
  </g>

  <!-- Right Column: Virtual Branch Lanes -->
  <g transform="translate(420, 85)">
    <rect width="615" height="445" rx="10" fill="#0a0a12" stroke="rgba(255, 255, 255, 0.06)" />

    <rect width="615" height="40" rx="10" fill="rgba(255, 255, 255, 0.02)" />
    <text x="20" y="25" fill="#ffffff" font-size="12" font-weight="700">ACTIVE VIRTUAL BRANCH LANES</text>
    <text x="490" y="25" fill="#38bdf8" font-size="11">Concurrent Stack</text>

    <!-- Lane 1: feat/part-1-schemas -->
    <g transform="translate(15, 60)">
      <rect width="585" height="105" rx="10" fill="#12121e" class="lane-1" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" />
      <circle cx="22" cy="24" r="5" fill="#38bdf8" />
      <text x="36" y="28" fill="#ffffff" font-size="13" font-weight="700">feat/part-1-schemas</text>
      <text x="380" y="28" fill="#38bdf8" font-size="11">Target Base: main</text>
      <line x1="15" y1="45" x2="570" y2="45" stroke="rgba(255, 255, 255, 0.04)" />
    </g>

    <!-- Lane 2: feat/part-2-services -->
    <g transform="translate(15, 180)">
      <rect width="585" height="105" rx="10" fill="#12121e" class="lane-2" stroke="rgba(168, 85, 247, 0.2)" stroke-width="1.5" />
      <circle cx="22" cy="24" r="5" fill="#c084fc" />
      <text x="36" y="28" fill="#ffffff" font-size="13" font-weight="700">feat/part-2-services</text>
      <text x="340" y="28" fill="#c084fc" font-size="11">Target Base: feat/part-1-schemas</text>
      <line x1="15" y1="45" x2="570" y2="45" stroke="rgba(255, 255, 255, 0.04)" />
    </g>

    <!-- Lane 3: feat/part-3-endpoints -->
    <g transform="translate(15, 300)">
      <rect width="585" height="105" rx="10" fill="#12121e" class="lane-3" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1.5" />
      <circle cx="22" cy="24" r="5" fill="#10b981" />
      <text x="36" y="28" fill="#ffffff" font-size="13" font-weight="700">feat/part-3-endpoints</text>
      <text x="340" y="28" fill="#10b981" font-size="11">Target Base: feat/part-2-services</text>
      <line x1="15" y1="45" x2="570" y2="45" stroke="rgba(255, 255, 255, 0.04)" />
    </g>
  </g>

  <!-- Animated Moving Cards (Moving from Unassigned to Virtual Lanes) -->
  
  <!-- Moving Card 1: schema.ts -->
  <g class="anim-card1">
    <rect width="260" height="52" rx="8" fill="#181828" stroke="#38bdf8" stroke-width="1.2" />
    <text x="14" y="22" fill="#ffffff" font-size="11" font-weight="700">src/types/schema.ts</text>
    <text x="14" y="40" fill="#38bdf8" font-size="10">+65 lines • Type definitions</text>
  </g>

  <!-- Moving Card 2: user.service.ts -->
  <g class="anim-card2">
    <rect width="260" height="52" rx="8" fill="#181828" stroke="#c084fc" stroke-width="1.2" />
    <text x="14" y="22" fill="#ffffff" font-size="11" font-weight="700">src/services/user.service.ts</text>
    <text x="14" y="40" fill="#c084fc" font-size="10">+120 lines • Business logic</text>
  </g>

  <!-- Moving Card 3: user.controller.ts -->
  <g class="anim-card3">
    <rect width="260" height="52" rx="8" fill="#181828" stroke="#10b981" stroke-width="1.2" />
    <text x="14" y="22" fill="#ffffff" font-size="11" font-weight="700">src/controllers/user.controller.ts</text>
    <text x="14" y="40" fill="#10b981" font-size="10">+95 lines • HTTP handlers</text>
  </g>

  <!-- Push Notification Popover -->
  <g transform="translate(680, 50)" class="push-badge">
    <rect width="330" height="34" rx="8" fill="#047857" stroke="#10b981" stroke-width="1.5" />
    <text x="16" y="22" fill="#ffffff" font-size="11" font-weight="700">All 3 branches pushed upstream in parallel</text>
  </g>
</svg>
