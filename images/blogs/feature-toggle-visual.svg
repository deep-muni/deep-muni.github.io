<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%" style="background:#09090f;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;">
  <defs>
    <radialGradient id="toggleBgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#09090f" stop-opacity="1" />
    </radialGradient>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="toggleGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="600" fill="#09090f" />
  <rect width="1200" height="600" fill="url(#toggleBgGlow)" />
  <rect width="1200" height="600" fill="url(#toggleGrid)" />

  <!-- Section Title -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" fill="#00d4ff" font-size="12" font-weight="700" letter-spacing="1.5">REAL-TIME BEHAVIOR DYNAMICS</text>
    <text x="0" y="32" fill="#ffffff" font-size="24" font-weight="800" letter-spacing="-0.5">How Dynamic Feature Toggles Alter Runtime Execution Instantly</text>
  </g>

  <!-- Left: State A (OFF / Disabled) -->
  <g transform="translate(60, 115)">
    <rect width="510" height="430" rx="16" fill="#101018" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

    <!-- Card Header -->
    <rect width="510" height="46" rx="16" fill="rgba(255, 255, 255, 0.02)" />
    <circle cx="25" cy="23" r="4.5" fill="#ef4444" opacity="0.6" />
    <circle cx="40" cy="23" r="4.5" fill="#f59e0b" opacity="0.6" />
    <circle cx="55" cy="23" r="4.5" fill="#10b981" opacity="0.6" />
    <text x="75" y="28" fill="rgba(255, 255, 255, 0.6)" font-size="13" font-weight="600">STATE: DISABLED (OFF)</text>

    <!-- Admin Switch OFF -->
    <g transform="translate(30, 70)">
      <rect width="450" height="70" rx="12" fill="rgba(0, 0, 0, 0.35)" stroke="rgba(255, 255, 255, 0.06)" />
      <text x="20" y="32" fill="#ffffff" font-size="14" font-weight="700">Flag: enable_ai_autocomplete</text>
      <text x="20" y="52" fill="rgba(255, 255, 255, 0.4)" font-size="11">Production State: Disabled (Kill-Switch Active)</text>

      <!-- Toggle UI Switch OFF -->
      <g transform="translate(370, 20)">
        <rect width="60" height="30" rx="15" fill="#262633" />
        <circle cx="15" cy="15" r="11" fill="#71717a" />
      </g>
    </g>

    <!-- Code & Execution Route -->
    <g transform="translate(30, 160)">
      <text x="0" y="16" fill="#71717a" font-size="12" font-weight="600">EVALUATION FLOW:</text>
      
      <!-- Code Box -->
      <rect y="28" width="450" height="110" rx="10" fill="#09090f" stroke="rgba(255, 255, 255, 0.06)" />
      <text x="16" y="56" fill="#f43f5e" font-size="12">if (useFeatureFlag('enable_ai_autocomplete')) {</text>
      <text x="36" y="76" fill="rgba(255, 255, 255, 0.25)" font-size="12">// [BYPASSED] return &lt;AIAutoSuggest /&gt;;</text>
      <text x="16" y="96" fill="#10b981" font-size="12">} return &lt;StandardSearchInput /&gt;; // [ACTIVE]</text>
      <text x="16" y="118" fill="rgba(255, 255, 255, 0.4)" font-size="11">Result: Evaluates to FALSE in &lt; 0.2ms</text>
    </g>

    <!-- User Experience Result -->
    <g transform="translate(30, 315)">
      <rect width="450" height="85" rx="10" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)" />
      <text x="20" y="28" fill="#94a3b8" font-size="12" font-weight="700">END USER EXPERIENCE:</text>
      <text x="20" y="50" fill="rgba(255, 255, 255, 0.75)" font-size="13">Standard legacy search bar rendered</text>
      <text x="20" y="70" fill="rgba(255, 255, 255, 0.45)" font-size="12">Zero AI inference latency or external API failure risk</text>
    </g>
  </g>

  <!-- Right: State B (ON / Enabled) -->
  <g transform="translate(630, 115)">
    <rect width="510" height="430" rx="16" fill="#101018" stroke="rgba(0, 212, 255, 0.3)" stroke-width="1.5" />

    <!-- Card Header -->
    <rect width="510" height="46" rx="16" fill="rgba(0, 212, 255, 0.08)" />
    <circle cx="25" cy="23" r="4.5" fill="#ef4444" opacity="0.6" />
    <circle cx="40" cy="23" r="4.5" fill="#f59e0b" opacity="0.6" />
    <circle cx="55" cy="23" r="4.5" fill="#10b981" opacity="0.9" filter="url(#glowGreen)" />
    <text x="75" y="28" fill="#00d4ff" font-size="13" font-weight="700">STATE: ENABLED (LIVE IN PROD)</text>

    <!-- Admin Switch ON -->
    <g transform="translate(30, 70)">
      <rect width="450" height="70" rx="12" fill="rgba(0, 212, 255, 0.04)" stroke="rgba(0, 212, 255, 0.25)" />
      <text x="20" y="32" fill="#ffffff" font-size="14" font-weight="700">Flag: enable_ai_autocomplete</text>
      <text x="20" y="52" fill="#10b981" font-size="11" font-weight="600">Production State: Enabled for All Users (SSE Push)</text>

      <!-- Toggle UI Switch ON -->
      <g transform="translate(370, 20)">
        <rect width="60" height="30" rx="15" fill="#0284c7" />
        <circle cx="45" cy="15" r="11" fill="#ffffff" filter="url(#glowCyan)" />
      </g>
    </g>

    <!-- Code & Execution Route -->
    <g transform="translate(30, 160)">
      <text x="0" y="16" fill="#00d4ff" font-size="12" font-weight="600">EVALUATION FLOW:</text>
      
      <!-- Code Box -->
      <rect y="28" width="450" height="110" rx="10" fill="#09090f" stroke="rgba(0, 212, 255, 0.2)" />
      <text x="16" y="56" fill="#10b981" font-size="12">if (useFeatureFlag('enable_ai_autocomplete')) {</text>
      <text x="36" y="76" fill="#00d4ff" font-weight="600" font-size="12">// [ACTIVE] return &lt;AIAutoSuggest stream={true} /&gt;;</text>
      <text x="16" y="96" fill="rgba(255, 255, 255, 0.25)" font-size="12">} return &lt;StandardSearchInput /&gt;; // [BYPASSED]</text>
      <text x="16" y="118" fill="#10b981" font-size="11">Result: Evaluates to TRUE in &lt; 0.2ms</text>
    </g>

    <!-- User Experience Result -->
    <g transform="translate(30, 315)">
      <rect width="450" height="85" rx="10" fill="rgba(0, 212, 255, 0.04)" stroke="rgba(0, 212, 255, 0.2)" />
      <text x="20" y="28" fill="#00d4ff" font-size="12" font-weight="700">END USER EXPERIENCE:</text>
      <text x="20" y="50" fill="#ffffff" font-size="13">Real-time AI streaming suggestions live in production</text>
      <text x="20" y="70" fill="#10b981" font-size="12">Released without any new build, commit, or cluster rollout</text>
    </g>
  </g>
</svg>
