<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background:#09090f;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;">
  <defs>
    <radialGradient id="gbGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#00d4ff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#09090f" stop-opacity="1" />
    </radialGradient>

    <linearGradient id="purpleNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <pattern id="gbGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="#09090f" />
  <rect width="1200" height="675" fill="url(#gbGlow)" />
  <rect width="1200" height="675" fill="url(#gbGrid)" />

  <!-- Header -->
  <g transform="translate(70, 45)">
    <rect x="0" y="0" width="190" height="28" rx="14" fill="rgba(168, 85, 247, 0.1)" stroke="rgba(168, 85, 247, 0.3)" />
    <text x="14" y="18" fill="#c084fc" font-size="12" font-weight="600" letter-spacing="1">STACKED WORKFLOWS</text>
    <text x="0" y="62" fill="#ffffff" font-size="28" font-weight="800" letter-spacing="-0.5">Stacked PRs with GitButler and Claude Code</text>
    <text x="0" y="88" fill="rgba(255, 255, 255, 0.55)" font-size="14">AI Spec Slicing | Virtual Working Directories | Azure DevOps Stack Management</text>
  </g>

  <!-- Step 1: Claude Code Spec Slicing (Left) -->
  <g transform="translate(70, 175)">
    <rect width="320" height="430" rx="16" fill="#11111b" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1.5" />
    <rect width="320" height="48" rx="16" fill="rgba(168, 85, 247, 0.06)" />
    <circle cx="25" cy="24" r="5" fill="#c084fc" />
    <text x="42" y="29" fill="#ffffff" font-size="14" font-weight="700">1. Claude Code Spec Slicing</text>

    <g transform="translate(20, 70)">
      <rect width="280" height="70" rx="10" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.06)" />
      <text x="14" y="26" fill="#c084fc" font-size="12" font-weight="700">Large Feature Requirements</text>
      <text x="14" y="48" fill="rgba(255, 255, 255, 0.5)" font-size="11">Break monolith PR into discrete layers</text>
    </g>

    <g transform="translate(20, 155)">
      <rect width="280" height="230" rx="10" fill="#0c0c14" stroke="rgba(255, 255, 255, 0.05)" />
      <text x="14" y="28" fill="rgba(255, 255, 255, 0.7)" font-size="12" font-weight="600">Generated Spec Slices:</text>
      
      <rect x="14" y="42" width="252" height="34" rx="6" fill="rgba(168, 85, 247, 0.1)" stroke="rgba(168, 85, 247, 0.2)" />
      <text x="24" y="63" fill="#e9d5ff" font-size="11">Slice 1: Database Schemas &amp; Types</text>

      <rect x="14" y="86" width="252" height="34" rx="6" fill="rgba(168, 85, 247, 0.1)" stroke="rgba(168, 85, 247, 0.2)" />
      <text x="24" y="107" fill="#e9d5ff" font-size="11">Slice 2: Core Domain &amp; Services</text>

      <rect x="14" y="130" width="252" height="34" rx="6" fill="rgba(168, 85, 247, 0.1)" stroke="rgba(168, 85, 247, 0.2)" />
      <text x="24" y="151" fill="#e9d5ff" font-size="11">Slice 3: API Endpoints &amp; Tests</text>

      <rect x="14" y="174" width="252" height="34" rx="6" fill="rgba(168, 85, 247, 0.1)" stroke="rgba(168, 85, 247, 0.2)" />
      <text x="24" y="195" fill="#e9d5ff" font-size="11">Slice 4: UI Components &amp; State</text>
    </g>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 390 390 L 440 390" stroke="url(#purpleNeon)" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Step 2: GitButler Virtual Branches (Center) -->
  <g transform="translate(440, 175)">
    <rect width="320" height="430" rx="16" fill="#11111b" stroke="rgba(0, 212, 255, 0.25)" stroke-width="1.5" />
    <rect width="320" height="48" rx="16" fill="rgba(0, 212, 255, 0.06)" />
    <circle cx="25" cy="24" r="5" fill="#38bdf8" />
    <text x="42" y="29" fill="#ffffff" font-size="14" font-weight="700">2. GitButler Virtual Branches</text>

    <g transform="translate(20, 70)">
      <rect width="280" height="70" rx="10" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.06)" />
      <text x="14" y="26" fill="#38bdf8" font-size="12" font-weight="700">Concurrent Branch Lanes</text>
      <text x="14" y="48" fill="rgba(255, 255, 255, 0.5)" font-size="11">Work on multiple slices with no git stash</text>
    </g>

    <g transform="translate(20, 155)">
      <rect width="280" height="230" rx="10" fill="#0c0c14" stroke="rgba(255, 255, 255, 0.05)" />
      <text x="14" y="28" fill="rgba(255, 255, 255, 0.7)" font-size="12" font-weight="600">Active Virtual Lanes:</text>

      <rect x="14" y="42" width="252" height="34" rx="6" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.25)" />
      <text x="24" y="63" fill="#bae6fd" font-size="11">Lane: feat/part-1-schemas</text>

      <rect x="14" y="86" width="252" height="34" rx="6" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.25)" />
      <text x="24" y="107" fill="#bae6fd" font-size="11">Lane: feat/part-2-core-logic</text>

      <rect x="14" y="130" width="252" height="34" rx="6" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.25)" />
      <text x="24" y="151" fill="#bae6fd" font-size="11">Lane: feat/part-3-endpoints</text>

      <rect x="14" y="174" width="252" height="34" rx="6" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.25)" />
      <text x="24" y="195" fill="#bae6fd" font-size="11">Lane: feat/part-4-ui-wiring</text>
    </g>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 760 390 L 810 390" stroke="url(#cyanNeon)" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Step 3: Azure DevOps Stack (Right) -->
  <g transform="translate(810, 175)">
    <rect width="320" height="430" rx="16" fill="#11111b" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5" />
    <rect width="320" height="48" rx="16" fill="rgba(16, 185, 129, 0.06)" />
    <circle cx="25" cy="24" r="5" fill="#10b981" />
    <text x="42" y="29" fill="#ffffff" font-size="14" font-weight="700">3. Azure DevOps Stack</text>

    <g transform="translate(20, 70)">
      <rect width="280" height="70" rx="10" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.06)" />
      <text x="14" y="26" fill="#10b981" font-size="12" font-weight="700">Sequential PR Chain</text>
      <text x="14" y="48" fill="rgba(255, 255, 255, 0.5)" font-size="11">Small, digestible PRs (~200 LOC)</text>
    </g>

    <g transform="translate(20, 155)">
      <rect width="280" height="230" rx="10" fill="#0c0c14" stroke="rgba(255, 255, 255, 0.05)" />
      <text x="14" y="28" fill="rgba(255, 255, 255, 0.7)" font-size="12" font-weight="600">Review Chain Target Base:</text>

      <rect x="14" y="42" width="252" height="34" rx="6" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.25)" />
      <text x="24" y="63" fill="#a7f3d0" font-size="11">PR 1: part-1 -> target: main</text>

      <rect x="14" y="86" width="252" height="34" rx="6" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.25)" />
      <text x="24" y="107" fill="#a7f3d0" font-size="11">PR 2: part-2 -> target: part-1</text>

      <rect x="14" y="130" width="252" height="34" rx="6" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.25)" />
      <text x="24" y="151" fill="#a7f3d0" font-size="11">PR 3: part-3 -> target: part-2</text>

      <rect x="14" y="174" width="252" height="34" rx="6" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.25)" />
      <text x="24" y="195" fill="#a7f3d0" font-size="11">PR 4: part-4 -> target: part-3</text>
    </g>
  </g>
</svg>
